# =============================================================================
# SaaS Revenue Intelligence — Logging Configuration
# =============================================================================

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  detailed:
    format: "%(asctime)s - %(levelname)s - %(name)s - [%(filename)s:%(lineno)d] - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  simple:
    format: "%(levelname)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file_app:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/app.log
    maxBytes: 10485760    # 10 MB
    backupCount: 5
    encoding: utf-8

  file_monitoring:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/monitoring.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

  file_errors:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/errors.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

loggers:
  src.monitoring:
    level: INFO
    handlers: [console, file_monitoring]
    propagate: false

  src.models:
    level: INFO
    handlers: [console, file_app]
    propagate: false

  src.pipelines:
    level: INFO
    handlers: [console, file_app]
    propagate: false

  api:
    level: INFO
    handlers: [console, file_app]
    propagate: false

root:
  level: INFO
  handlers: [console, file_app, file_errors]
